services:
  webpilot:
    build: .
    container_name: mcp-webpilot
    init: true
    ipc: host
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      BROWSER_HEADLESS: "true"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - browser_profile:/app/data/browser-profile
    restart: unless-stopped

volumes:
  browser_profile:
